workflows:
  rivet-rise-app-store:
    name: Rivet Rise App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: rivetrise
    environment:
      xcode: 26.3
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rivetrise.game18
      vars:
        APP_STORE_APPLE_ID: "6836443439"
        XCODE_PROJECT: RivetRise.xcodeproj
        XCODE_SCHEME: RivetRise
    scripts:
      - name: Set up provisioning profiles
        script: xcode-project use-profiles
      - name: Increment App Store build number
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")"
          agvtool new-version -all "$((LATEST_BUILD_NUMBER + 1))"
      - name: Build signed IPA
        script: xcode-project build-ipa --project "$CM_BUILD_DIR/$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
